apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-footprint-settings
spec:
  forms:
    - group: base
      label: 基本设置
      formSchema:
        - $formkit: text
          label: 页面标题
          name: title
          validation: required
          value: '我的足迹'
          help: "这里是你的网址标题"
        - $formkit: text
          label: 左下角标题
          name: logoName
          validation: required
          value: '足迹'
          help: "这里是左下角的标题"
        - $formkit: text
          label: 足迹描述
          name: describe
          validation: required
          value: '每一处足迹都充满了故事，那是对人生的思考和无限的风光。'
          help: "这里是左下角的描述"
        - $formkit: text
          label: hsl颜色值
          name: hsla
          validation: required
          value: '109,68%,60%'
          help: "全局配色 HSL格式：322,68%,60% (色相去掉deg,数值之间不要有空格)"
        - $formkit: checkbox
          label: 启用悬停缩放
          name: enableHoverZoom
          value: true
          help: "悬停时间线卡片时，是否先缩放到对应位置再显示抛物线动画"
        - $formkit: checkbox
          label: 高亮已去过城市
          name: highlightVisitedCities
          value: true
          help: "使用主题色显示已经去过的城市区域"
        - $formkit: number
          label: 图片墙单页展示数量
          name: photoWallPageSize
          value: 6
          min: 1
          max: 12
          step: 1
          validation: required|number|between:1,12
          help: "每个足迹图片墙单页最多展示的图片数量，超出后可使用左右箭头翻页(1-12)"
        - $formkit: select
          label: 图片墙样式
          name: photoWallStyle
          value: original
          options:
            - label: 经典方案
              value: original
            - label: 地图侧边展开式画廊
              value: gallery
            - label: 胶片带模式
              value: filmstrip
            - label: 旅行手账模式
              value: journal
            - label: 聚焦式照片墙
              value: focus
          help: "选择桌面端图片墙的展示方式；移动端仍使用原有信息窗口(部分样式为固定图片数量)"
        - $formkit: secret
          label: 高德 Js Key
          name: gaoDeKeySecretName
          descriptionPreset: 高德地图 Js Key
          requiredKeys:
            - key: key
              help: 高德地图浏览器端 Key
          help: 创建一个包含 key 字段的 Secret。主要用于创建地图。
        - $formkit: secret
          label: 高德 Web Key
          name: gaoDeWebKeySecretName
          descriptionPreset: 高德地图 Web Key
          requiredKeys:
            - key: key
              help: 高德地图 Web 服务 Key
          help: 创建一个包含 key 字段的 Secret。用于服务端地理编码和逆地理编码。
        - $formkit: select
          name: mapStyle
          label: 地图样式
          sortable: true
          clearable: true
          searchable: true
          placeholder: 请选择你的主题
          options:
            - label: 标准
              value: amap://styles/normal
            - label: 幻影黑
              value: amap://styles/dark
            - label: 月光银
              value: amap://styles/light
            - label: 远山黛
              value: amap://styles/whitesmoke
            - label: 草色青
              value: amap://styles/fresh
            - label: 雅士灰
              value: amap://styles/grey
            - label: 涂鸦
              value: amap://styles/graffiti
            - label: 马卡龙
              value: amap://styles/macaron
            - label: 靛青蓝
              value: amap://styles/blue
            - label: 极夜蓝
              value: amap://styles/darkblue
            - label: 酱籽
              value: amap://styles/wine
        - $formkit: select
          name: markerStyle
          label: 标记点样式
          value: 'photo'
          options:
            - label: 水滴标记
              value: pin
            - label: 简约圆形
              value: circle
            - label: 卡片标记
              value: card
            - label: 照片徽章
              value: photo
        - $formkit: select
          name: highlightScheme
          label: 悬停高亮方案
          value: 'ring'
          options:
            - label: 缩放光晕
              value: glow
            - label: 脉冲光环
              value: pulse
            - label: 弹跳动画
              value: bounce
            - label: 边框高亮环
              value: ring
    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: list
          name: footprintTypes
          label: 足迹类型
          addLabel: 添加类型
          min: 1
          value: ["旅游", "美食", "购物", "住宿", "交通", "其他"]
          help: "自定义足迹类型"
          itemType: string
          children:
            - $formkit: text
              index: "$index"
              validation: required
    - group: globe3d
      label: 3D 地球
      formSchema:
        - $formkit: text
          label: 3D 地球标题
          name: globeTitle
          value: '旅行记忆'
          help: "3D 地球导航栏与首页标题卡的标题（不读取基本设置中的左下角标题）"
        - $formkit: textarea
          label: 3D 地球描述
          name: globeDesc
          value: '把每一次出发，收藏成地球上的坐标；让走过的城市，成为星空下的故事。'
          help: "3D 地球首页标题卡的描述文字（不读取基本设置中的足迹描述）"
        - $formkit: select
          label: 地球地名标注
          name: globeLabels
          value: all
          options:
            - label: 关闭（仅悬停显示）
              value: off
            - label: 只显示城市名
              value: city
            - label: 城市名 + 足迹名
              value: all
          help: "地名的常驻显示方式：整球视图标注去过的城市，放大到城市后标注各条足迹（同名城市下按到访顺序编号）。
                 使用「无字」底图（高德卫星·无字 / 天地图无标注）时尤其建议开启，否则画面上没有任何地名参照"
        - $formkit: text
          label: 天地图 Key
          name: tiandituKey
          value: ''
          help: "https://lbs.tianditu.gov.cn 注册后申请（浏览器端应用）。不填则 3D 地球只显示高德底图，天地图影像/矢量底图与三维地形不可用"
        - $formkit: checkbox
          label: 默认启用三维地形
          name: enableTerrainDefault
          value: false
          help: "配置了天地图 Key 后，进入 3D 地球时是否默认开启三维地形（用户仍可在导航栏手动切换）"
        - $formkit: select
          label: 票根切换样式
          name: ticketGalleryStyle
          value: fan
          options:
            - label: 票夹切换
              value: fan
            - label: 横向长串浏览
              value: strip
          help: "选择票根页的切换样式：票夹叠放式，或横向长串滚动浏览式（主图居中，支持滚轮与拖拽切换）"
        - $formkit: number
          label: 移动端城市卡片墙每排城市数
          name: mobileCityWallColumns
          value: 2
          min: 1
          max: 3
          step: 1
          validation: required|number|between:1,3
          help: "手机端打开「城市」卡片墙时，每排显示的城市卡片数量（1-3）；桌面端不受影响"
        - $formkit: checkbox
          label: 去年今天
          name: enableTimeCapsule
          value: true
          help: "在城市卡片墙顶栏显示「去年今天」入口：历史上同月同日有足迹时，可回看当天的照片与票根"
        - $formkit: checkbox
          label: 足迹洞察
          name: enableInsight
          value: true
          help: "在城市卡片墙顶栏显示「足迹洞察」入口：自动生成旅行总结文案与统计"
        - $formkit: checkbox
          label: PC 城市卡片悬停轮播
          name: cityCardHoverCarousel
          value: true
          help: "PC 端鼠标悬停或键盘聚焦城市卡片时，封面在最多 3 张照片间轮播；移动端不生效"
        - $formkit: checkbox
          label: 旅行明信片
          name: enablePostcard
          value: true
          help: "为每张城市卡片提供「明信片」按钮，可预览、下载或分享生成的竖版旅行明信片"
        - $formkit: checkbox
          label: 票根页 · 重走一遍
          name: enableTicketJourneyReplay
          value: false
          help: "在票根页提供「重走」放映模式：按日期从第一张票开始，镜头在城市间飞行，逐张回放票根"
        - $formkit: checkbox
          label: 票根页 · 时间有色
          name: enableTicketSeasonLight
          value: false
          help: "票根氛围色跟随票根日期月份变化（春绿/夏金/秋赭/冬蓝），仅作用于页面环境与描边，不改变票根图颜色"
        - $formkit: checkbox
          label: 票根页 · 命运抽票
          name: enableTicketOracle
          value: false
          help: "在票根页提供「抽取下一站」：洗牌翻开一张已有票根，并从未收录票根的城市中给出灵感"
        - $formkit: checkbox
          label: 票根页 · 未寄出的明信片
          name: enableTicketLetter
          value: false
          help: "为每张票根提供「写信」动作，自动生成一张可下载/分享的票根明信片"
        - $formkit: checkbox
          label: 票根页 · 护照集章
          name: enableTicketPassport
          value: false
          help: "正式浏览票根时盖章记录（本机存储），并提供护照进度页；集齐后显示金色护照封面"
    - group: imageProcess
      label: 图片处理配置
      help: "如果你的图床需要给同一张原图生成不同质量的缩略图，可在此按用途配置 URL 规则；三项都留空时，界面将直接使用足迹中保存的图片 URL（通用做法）。"
      formSchema:
        - $formkit: text
          label: 标记点图片：要替换的片段
          name: markerImageFrom
          value: ''
          placeholder: "例如：!w100"
          help: "地图标记点小图：把足迹图片 URL 中的哪一段替换掉，例如阿里云处理后缀 !w100。不需要时留空，标记点直接使用原 URL。"
        - $formkit: text
          label: 标记点图片：替换为
          name: markerImageTo
          value: ''
          placeholder: "例如：!A100"
          help: "把上一项命中的片段替换成什么，例如更低质量的 !A100。留空表示只删除上一项片段。"
        - $formkit: text
          label: 标记点图片：追加后缀
          name: markerImageSuffix
          value: ''
          placeholder: "例如：/fw/200"
          help: "替换完成后，在 URL 末尾额外追加的图床压缩/裁剪参数。不同图床写法不同，例如阿里云 /fw/200、七牛 ?imageView2/1/w/200。留空不追加。"
        - $formkit: text
          label: 时间线/详情图片：要替换的片段
          name: timelineImageFrom
          value: ''
          placeholder: "例如：!w100"
          help: "2D 时间线抽屉与足迹详情窗口使用的图片 URL 替换片段。可与标记点不同，例如时间线用较高画质 !A100。"
        - $formkit: text
          label: 时间线/详情图片：替换为
          name: timelineImageTo
          value: ''
          placeholder: "例如：!A100"
          help: "时间线/详情图片的替换目标片段。"
        - $formkit: text
          label: 时间线/详情图片：追加后缀
          name: timelineImageSuffix
          value: ''
          placeholder: "例如：/fw/500"
          help: "时间线/详情图片替换完成后追加的 URL 后缀。"
        - $formkit: text
          label: 城市卡片墙图片：要替换的片段
          name: cityWallImageFrom
          value: ''
          placeholder: "例如：!w100"
          help: "3D 地球城市卡片墙封面与轮播预览图使用的 URL 替换片段，与地图标记点独立。三项都留空时沿用「标记点图片」的 from→to 替换规则（不追加标记点后缀），保持旧版行为。"
        - $formkit: text
          label: 城市卡片墙图片：替换为
          name: cityWallImageTo
          value: ''
          placeholder: "例如：!A100"
          help: "城市卡片墙图片的替换目标片段。留空表示只删除上一项片段。"
        - $formkit: text
          label: 城市卡片墙图片：追加后缀
          name: cityWallImageSuffix
          value: ''
          placeholder: "例如：/fw/300"
          help: "城市卡片墙图片替换完成后在 URL 末尾追加的图床压缩/裁剪参数；留空不追加。旧版复用标记点规则时同样不会追加后缀。"
