plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
    // 前台 js/css 的压缩步骤要用（ui 子项目也用同一个插件管 node）
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'cc.lik.footprint'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

/*
 * 前台静态资源压缩。
 *
 * 源文件原地不动，只压缩 processResources 拷进 build/resources/main 的那一份，
 * 所以必须排在 processResources 之后。详见 frontend-build/esbuild.config.mjs。
 *
 * 用 node-gradle 插件跑：ui 子项目本来就靠它管 node/pnpm，node 早已是硬依赖，
 * 这里不引入新的环境要求。
 */
// 这里刻意用 npm 而不是 ui 子项目那套 pnpm：
// 仓库根有 pnpm-workspace.yaml，pnpm 会把 frontend-build 当成 workspace 的一部分、
// 因其不在 packages 里而「已是最新」却什么都不装；加 --ignore-workspace 又会连带
// 忽略 onlyBuiltDependencies，于是 pnpm 因 esbuild 的 postinstall 被拦而报错退出。
// 这个目录只有一个依赖，用 npm 直接绕开整套纠缠。
tasks.register('minifyFrontendInstall', com.github.gradle.node.npm.task.NpmTask) {
    workingDir = file('frontend-build')
    args = ['install', '--no-audit', '--no-fund']
    inputs.file('frontend-build/package.json')
    outputs.dir('frontend-build/node_modules')
}

// 前台模块契约检查：注入键、顶层 deps 访问、setup/init 顺序这类 esbuild 不报的错，
// 在打包前拦下，而不是等浏览器里炸。脚本纯 Node、无依赖，详见 tools/check-frontend-contract.mjs。
tasks.register('checkFrontendContract', com.github.gradle.node.task.NodeTask) {
    group = 'verification'
    description = '检查前台模块注入契约与装配顺序'
    script = file('tools/check-frontend-contract.mjs')

    inputs.dir('src/main/frontend/travel-memory')
    inputs.file('tools/check-frontend-contract.mjs')
    // 无产物；声明一个标记文件，让输入不变时可跳过
    def marker = layout.buildDirectory.file('tmp/checkFrontendContract/ok')
    outputs.file(marker)
    doLast { marker.get().asFile.text = 'ok' }
}

// 前台纯函数单测：Node 自带的 node:test，不引入测试框架依赖。挂在 test 上，./gradlew build 会跑。
tasks.register('testFrontend', com.github.gradle.node.task.NodeTask) {
    group = 'verification'
    description = '运行前台纯函数单测（src/test/frontend）'
    script = file('tools/run-frontend-tests.mjs')

    inputs.dir('src/main/frontend')
    inputs.dir('src/test/frontend')
    def marker = layout.buildDirectory.file('tmp/testFrontend/ok')
    outputs.file(marker)
    doLast { marker.get().asFile.text = 'ok' }
}

tasks.named('test') {
    dependsOn tasks.named('testFrontend')
}

// 前台视觉规范（柔光玻璃，见 src/main/frontend/styles/DESIGN.md）：英文大写小标题、「·」拼接、
// 散落的色值、旧字体栈。和契约检查一样挂在打包前，不过就失败。
tasks.register('checkFrontendStyle', com.github.gradle.node.task.NodeTask) {
    group = 'verification'
    description = '检查前台视觉规范'
    script = file('tools/check-frontend-style.mjs')
    args = ['--strict', '--quiet']

    inputs.dir('src/main/frontend')
    inputs.file('src/main/resources/templates/footprint.html')
    inputs.file('tools/check-frontend-style.mjs')
    def marker = layout.buildDirectory.file('tmp/checkFrontendStyle/ok')
    outputs.file(marker)
    doLast { marker.get().asFile.text = 'ok' }
}

tasks.register('minifyFrontend', com.github.gradle.node.npm.task.NpmTask) {
    group = 'build'
    description = '压缩前台 js/css（源文件不动，只改构建产物）'
    workingDir = file('frontend-build')
    args = ['run', 'minify']

    dependsOn tasks.named('checkFrontendContract')
    dependsOn tasks.named('checkFrontendStyle')
    dependsOn tasks.named('minifyFrontendInstall')
    dependsOn tasks.named('processResources')

    inputs.dir('src/main/frontend')
    inputs.files('frontend-build/esbuild.config.mjs', 'frontend-build/package.json')
    outputs.dir(layout.buildDirectory.dir('resources/main/static/js'))
    outputs.dir(layout.buildDirectory.dir('resources/main/static/css'))
}

/*
 * DevTools 以 exploded 目录运行时，会从 build/resources/main/META-INF
 * 读取组件索引；Halo 生成的新索引在 build/tmp/META-INF。若不显式同步，
 * 新增 @Component 后热重载仍会拿到上一次构建的旧索引，表现为
 * “类已打进 JAR，但插件容器找不到对应 Bean”。
 */
tasks.register('syncPluginComponentsIdx', Copy) {
    dependsOn tasks.named('generatePluginComponentsIdx')
    dependsOn tasks.named('processResources')
    from layout.buildDirectory.file('tmp/META-INF/plugin-components.idx')
    into layout.buildDirectory.dir('resources/main/META-INF')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
    dependsOn tasks.named('minifyFrontend')
    dependsOn tasks.named('syncPluginComponentsIdx')
}

def haloAdminUsername = providers.gradleProperty('haloAdminUsername')
    .orElse(providers.environmentVariable('HALO_ADMIN_USERNAME'))
def haloAdminPassword = providers.gradleProperty('haloAdminPassword')
    .orElse(providers.environmentVariable('HALO_ADMIN_PASSWORD'))

halo {
    version = '2.27'
    debug = true
    // 本机 8090 被别的 Halo 占用时：./gradlew haloServer -PhaloPort=8092
    port = (findProperty('haloPort') ?: '8090') as Integer

    // DevTools 默认用 admin/admin 做 Basic Auth；已有开发数据通常改过管理员，
    // 未显式配置时轻量命令会全部返回 401。凭据只从本地参数或环境变量读取。
    if (haloAdminUsername.isPresent()) {
        superAdminUsername = haloAdminUsername.get()
    }
    if (haloAdminPassword.isPresent()) {
        superAdminPassword = haloAdminPassword.get()
    }
}
